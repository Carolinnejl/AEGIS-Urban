# ============================================================
# AEGIS Urban — CI Pipeline (GitHub Actions)
# ============================================================
# Se ejecuta en cada push a main y en cada Pull Request.
# Pasos: install → lint → test → build
# ============================================================

name: CI — AEGIS Urban

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Backend ───────────────────────────────────────────────
  backend:
    name: Backend (Node.js + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-urban-backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aegis-urban-backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar tests unitarios
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          DB_HOST:  localhost
          DB_PORT:  5432
          DB_NAME:  aegis_test_db
          DB_USER:  aegis_app_user
          DB_PASSWORD: test_password

      - name: Compilar a JavaScript
        run: npm run build

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-urban-frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aegis-urban-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar tests
        run: npm test

      - name: Build de producción
        run: npm run build

  # ── Pruebas en vivo: integración + seguridad + rendimiento ──
  pruebas-en-vivo:
    name: Integración, seguridad y rendimiento (API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis_app_user
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: aegis_urban_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis_app_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: aegis_urban_db
      DB_USER: aegis_app_user
      DB_PASSWORD: ci_password_123
      PGPASSWORD: ci_password_123
      JWT_SECRET: ci-0f8d3b7a91c24e6fb5a7d1c3e9f04b82a6d5c7e1f3b9a8d0c2e4f6a8b1d3c5e7
      AES_SECRET_KEY: 4f1a9c7e3b5d8206a1c4e7b9d2f50386c9e1a4b7d0f3256881ae4c7b9d2f5031
      FRONTEND_URL: http://localhost:5173
      PORT: "3001"
      BACKUP_AUTOMATICO: "false"
      VERIFICACION_EMAIL_REAL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aegis-urban-backend/package-lock.json
      - name: Aplicar migraciones y datos iniciales
        run: |
          for f in aegis-urban-backend/database/migrations/*.sql; do
            psql -h localhost -U aegis_app_user -d aegis_urban_db -v ON_ERROR_STOP=1 -1 -f "$f"
          done
          for f in aegis-urban-backend/database/seeds/*.sql; do
            psql -h localhost -U aegis_app_user -d aegis_urban_db -f "$f"
          done
      - name: Instalar y compilar
        working-directory: aegis-urban-backend
        run: npm ci && npm run build
      - name: Levantar la API
        working-directory: aegis-urban-backend
        run: |
          nohup npm start > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/api/health && break; sleep 1; done
      - name: Pruebas de integración y seguridad
        working-directory: aegis-urban-backend
        run: npm run test:live
      - name: Prueba de rendimiento (corta)
        working-directory: aegis-urban-backend
        run: node scripts/rendimiento.mjs 4 10
      - name: Log de la API si algo falla
        if: failure()
        run: tail -n 100 api.log
